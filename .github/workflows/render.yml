name: Render

# Shared cloud-render farm for Emotion Media's Remotion video skills
# (biointel-reel, short-form-builder, ...). GitHub-hosted runners are
# 4 cores / 16 GB, so there's no OOM constraint like a local laptop.
#
# Usage — one render per branch (branch-per-render):
#   * push a project on a branch like `biointel/2026-06-17` or `shortform/<client>`
#     -> renders a 1080p draft (scale=1) automatically
#   * "Run workflow" (manual) on that branch -> override composition / scale / crf
#     e.g. scale=2 for a 4K (2160x3840) final
#
# The finished MP4 is uploaded as a build artifact; download it from the run's
# Summary page. Delete the branch after downloading to keep the repo lean
# (committed video bloats git history).

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition id"
        default: "Reel"
      entry:
        description: "Remotion entry point"
        default: "src/index.ts"
      scale:
        description: "Render scale (1 = 1080p, 2 = 4K 2160x3840)"
        default: "1"
        type: choice
        options: ["1", "2"]
      crf:
        description: "H.264 CRF (lower = higher quality; 18 is visually lossless)"
        default: "18"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # System libraries chrome-headless-shell needs to run, plus ffmpeg.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0 libxshmfence1

      - name: Install dependencies
        run: npm install

      # Cross-platform rspack native binary fix (installs linux-x64-gnu here).
      - name: Ensure rspack binary
        run: node scripts/bootstrap.mjs || true

      - name: Compute artifact name
        id: meta
        run: |
          SAFE=$(echo "${{ github.ref_name }}" | tr '/ ' '--')
          echo "name=reel-${SAFE}-scale${{ github.event.inputs.scale || '1' }}" >> "$GITHUB_OUTPUT"

      - name: Render
        run: |
          COMP="${{ github.event.inputs.composition || 'Reel' }}"
          ENTRY="${{ github.event.inputs.entry || 'src/index.ts' }}"
          SCALE="${{ github.event.inputs.scale || '1' }}"
          CRF="${{ github.event.inputs.crf || '18' }}"
          echo "Rendering $COMP ($ENTRY) at scale=$SCALE crf=$CRF"
          npx remotion render "$ENTRY" "$COMP" out/reel.mp4 \
            --scale="$SCALE" \
            --crf="$CRF" \
            --concurrency=2 \
            --log=verbose

      - name: Probe output
        run: ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -show_entries format=duration -of default=noprint_wrappers=1 out/reel.mp4

      - name: Upload reel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: out/reel.mp4
          retention-days: 14
